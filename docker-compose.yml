services:
  app:
    build: .
    container_name: partygames
    env_file:
      - .env
    volumes:
      # SQLite bazası konteynerdən kənarda saxlanılır ki, yenidən build zamanı itməsin
      - ./data:/app/data
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.partygames-http.entrypoints=http"
      - "traefik.http.routers.partygames-http.middlewares=https-redirect@docker"
      - "traefik.http.routers.partygames-http.rule=Host(`${PG_DOMAIN}`)"
      - "traefik.http.routers.partygames-https.entrypoints=https"
      - "traefik.http.routers.partygames-https.rule=Host(`${PG_DOMAIN}`)"
      - "traefik.http.routers.partygames-https.tls=true"
      - "traefik.http.routers.partygames-https.tls.certresolver=le"
      - "traefik.http.services.partygames.loadbalancer.server.port=3000"
    restart: always

networks:
  traefik-public:
    external: true
